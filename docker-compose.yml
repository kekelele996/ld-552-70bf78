services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: talentflow
      POSTGRES_PASSWORD: talentflow
      POSTGRES_DB: talentflow
    ports:
      - "5432:5432"
    volumes:
      - talentflow_pg:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://talentflow:talentflow@postgres:5432/talentflow?schema=public
      JWT_SECRET: talentflow-secret
      PORT: 3000
    depends_on: [postgres]
    ports: ["3000:3000"]
  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api
    depends_on: [backend]
    ports: ["5173:5173"]
volumes:
  talentflow_pg:
